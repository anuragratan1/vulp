services:
  vulp:
    build:
      context: .
      dockerfile: Dockerfile
    image: vulp-platform:latest
    container_name: vulp-studio
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - DB_DIR=/app/data
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - WF_MASTER_KEY=${WF_MASTER_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL}
    volumes:
      - vulp-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vulp-data:
    name: vulp-platform-data
